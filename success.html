<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="icon.png" type="image/png">
  <title>お支払い完了 — AIチャット整理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #0f0f17;
      color: #e2e2e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid rgba(124, 92, 252, 0.25);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(124, 92, 252, 0.15);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7c5cfc, #a78bfa);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #a78bfa, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 14px;
      color: rgba(226,226,232,0.75);
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .steps {
      margin: 20px 0;
      text-align: left;
      background: rgba(124,92,252,0.08);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      color: rgba(226,226,232,0.8);
      line-height: 1.5;
      padding: 6px 0;
    }
    .step-num {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #7c5cfc, #a78bfa);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-top: 1px;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: #a78bfa;
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>お支払いが完了しました</h1>
    <p>AIチャット整理の<strong>Proプラン</strong>が有効になりました。</p>
    <p>課金状態は数秒で拡張機能に反映されます。</p>

    <div class="steps">
      <div class="step">
        <span class="step-num">1</span>
        <span>ブラウザに戻り、ChatGPT・Claude・Geminiのいずれかを開いてください</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span>サイドパネルの「📁」ボタンをクリックして拡張機能を開いてください</span>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <span>設定セクションでProプランが反映されていることをご確認ください</span>
      </div>
    </div>

    <p>ご不明な点がございましたら、<br>お問い合わせください。</p>
    <a href="https://yudai96sh-dot.github.io/ai-chat-seiri/" class="back-link">← サイトに戻る</a>
  </div>
</body>
</html>
